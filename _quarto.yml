project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "proyectos/*.qmd"

website:
  title: "Joaquín"
  description: "Ciencia política · desigualdad y élites · métodos cuantitativos con R"
  site-url: "https://joaquinvapasten.github.io"
  favicon: img/perfil.jpg
  reader-mode: false

  navbar:
    pinned: true
    logo: ""
    title: "Joaquín"
    left:
      - text: "Sobre mí"
        href: index.qmd
      - text: "CV"
        href: cv.qmd
      - text: "Explorador"
        href: explorador.qmd
    right:
      - icon: envelope
        href: "mailto:joaquinvapasten@gmail.com"
        aria-label: Email
      - icon: github
        href: "https://github.com/joaquinvapasten"
        aria-label: GitHub
      - icon: linkedin
        href: "https://www.linkedin.com/in/joaqu%C3%ADn-valenzuela-past%C3%A9n-66ba12273/"
        aria-label: LinkedIn

  page-footer:
    border: false
    left: "© 2026 Joaquín"
    center: "Estratificación · desigualdad · métodos cuantitativos"
    right: "Hecho con [Quarto](https://quarto.org)"

format:
  html:
    theme: custom.scss
    css: styles.css
    toc: false
    page-layout: full
    grid:
      body-width: 1000px
    link-external-newwindow: true
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
