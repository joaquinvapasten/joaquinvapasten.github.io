name: Publicar sitio Quarto
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # El CV se escribe en cv/cv.tex; aquí se compila con la fecha de hoy en hora de Chile
      - name: Compilar el CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          working_directory: cv
          extra_system_packages: "tzdata"
          pre_compile: "export TZ=America/Santiago"

      - name: Poner el CV compilado en la página
        run: cp cv/cv.pdf files/cv.pdf

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Cache de paquetes R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::ggplot2
            any::plotly
            any::DT
            any::leaflet
            any::tidyr
            any::jsonlite
            any::scales
            any::knitr
            any::rmarkdown

      - name: Renderizar y publicar
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
